name: build-miyoo-mini
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/onionui/miyoomini-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean and Build
        run: |
          make clean || true
          make

      - name: Package Artifact
        run: |
          (command -v zip >/dev/null) || (apt-get update && apt-get install -y zip)
          chmod +x ./package.sh
          ./package.sh
          
      - uses: actions/upload-artifact@v4
        with:
          name: Stremio-Mini
          path: Stremio-Mini.zip