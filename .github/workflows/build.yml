name: build-miyoo-mini
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile inside Toolchain Container
        run: |
          docker run --rm -v "$PWD":/root/workspace ghcr.io/onionui/miyoomini-toolchain:latest sh -c 'cd /root/workspace && make clean && make && chmod +x ./package.sh && ./package.sh'
          
      - uses: actions/upload-artifact@v4
        with:
          name: Stremio-Mini
          path: Stremio-Mini.zip
